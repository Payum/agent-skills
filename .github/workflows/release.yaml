name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/skills.py validate
      - run: python3 scripts/skills.py package
      - name: Attach one zip per skill
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            gh release upload "$TAG" "${zips[@]}" --clobber
          fi
